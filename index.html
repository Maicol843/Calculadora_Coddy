<!--
MOSTRAR INPUT Y BOTONES

El atributo disabled se utiliza para controlar si el usuario puede interactuar con campos de entrada específicos, 
asegurando un flujo adecuado y la integridad de los datos en el formulario.
Ejemplo:
<input type="password" name="title" disabled>

1. Dentro de "calculator", crea una etiqueta input con el atributo type "text" y un ID "display". Además, hazlo disabled.
2. Debajo del input, crea un div con el nombre de clase 'buttons'.
-->
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
</head>
    <body>
        <!-- Write HTML code here -->
         <div class="calculator">
            <input type="text" id="display" disabled>
            <div class="buttons"></div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
